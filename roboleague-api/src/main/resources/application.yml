spring:
  application:
    name: roboleague
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/roboleague}
    username: ${DB_USER:roboleague}
    password: ${DB_PASSWORD:roboleague}
  jackson:
    deserialization:
      # A misspelled field is a 400, not silently ignored (a "penalties" list would be lost).
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

roboleague:
  time-zone: ${ROBOLEAGUE_TIME_ZONE:America/Argentina/Buenos_Aires}
