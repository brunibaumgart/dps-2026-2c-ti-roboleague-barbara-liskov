spring:
  application:
    name: roboleague
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roboleague}
    username: ${DB_USER:roboleague}
    password: ${DB_PASSWORD:roboleague}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
