# Required check for PRs: in GitHub, Settings -> Branches -> protect main -> require the "build" status check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Compiles and runs unit, repository and API tests (Testcontainers uses the runner's Docker).
      - run: mvn -B verify
      # Coverage of every module (unit, repository and API tests together); download it from the run's summary.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: roboleague-api/target/site/jacoco-aggregate/
      # Node is only used by native JS tests; frontend assets need no build or npm packages.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test roboleague-api/src/test/frontend/*.test.mjs
