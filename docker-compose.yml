services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roboleague
      POSTGRES_USER: roboleague
      POSTGRES_PASSWORD: roboleague
    ports:
      - "5432:5432"
    volumes:
      - roboleague-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roboleague -d roboleague"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  roboleague-data:
